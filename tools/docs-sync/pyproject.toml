[project]
name = "docs-sync"
version = "0.1.0"
description = "Detect drift between TeamTalkRust source code and external Markdown docs."
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0 OR MIT"
authors = [
    { name = "TeamTalkRust contributors" },
]
keywords = ["docs", "drift", "markdown", "rust", "teamtalk"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Topic :: Documentation",
    "Topic :: Software Development :: Documentation",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "typer>=0.15,<1.0",
]

[project.scripts]
docs-sync = "docs_sync.cli:main"

[project.urls]
Repository = "https://github.com/BlindMaster24/TeamTalkRust"
Issues = "https://github.com/BlindMaster24/TeamTalkRust/issues"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.7",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docs_sync"]

[tool.hatch.build.targets.sdist]
include = [
    "src/docs_sync",
    "tests",
    "README.md",
    "pyproject.toml",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    # docstring rules incompatible with each other (choose D211 + D212)
    "D203",
    "D213",
    # Typer exposes one option per parameter; argparse-style grouping not
    # applicable here.
    "PLR0913",
    # We intentionally use ``Path.cwd()`` / constants as default values
    # (wrapped with None + resolve inside the body) — PLR2004 is too noisy
    # for test literals.
    "PLR2004",
    # TRIO/ASYNC rules not applicable to a synchronous CLI tool.
    "ASYNC",
    # Copyright headers are not required for internal dev tooling.
    "CPY",
    # Pandas-oriented rules not applicable.
    "PD",
    # Django-oriented rules not applicable.
    "DJ",
    # NumPy-oriented rules not applicable.
    "NPY",
    # The tool ships without external deps beyond Typer; enabling S-series
    # rules that flag generic subprocess/urllib usage is noise here.
    "S603",
    "S607",
    # ``assert`` is used in tests; fine.
    "S101",
    # ruff's own formatter and COM812 conflict; follow the formatter.
    "COM812",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    # Tests may use fixtures + plain asserts + magic constants.
    "D",
    "ANN",
    "SLF001",
    "PLR2004",
    "S101",
    "INP001",
]
"src/docs_sync/checkers/*.py" = [
    # Checkers legitimately have many parameters and branches by design.
    "PLR0912",
    "PLR0915",
    "C901",
]
"src/docs_sync/cli.py" = [
    # Typer-style CLI exposes each option as a parameter with a default; the
    # bool `--warn-only/--strict` switch is the idiomatic Click/Typer pattern
    # and not a traditional positional-boolean trap.
    "FBT001",
    "FBT002",
    "FBT003",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
warn_unused_ignores = true
show_error_codes = true
show_column_numbers = true
pretty = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--import-mode=importlib",
]
filterwarnings = ["error"]
