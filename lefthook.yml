pre-commit:
  commands:
    fmt:
      run: cargo fmt --all -- --check
    check:
      run: cargo check --workspace --all-targets
    clippy:
      run: cargo clippy --workspace --all-targets --all-features -- -D warnings
    test:
      run: cargo test --workspace --all-targets --all-features
    doc:
      run: cargo doc --no-deps --all-features
    doc-links:
      run: scripts/check-doc-links.sh
    docs-sync:
      # Warn-only during bootstrap so historical drift does not block commits.
      # Flip to ``check`` (without ``--warn-only``) once the existing drift
      # has been fixed (see docs/docs-sync.md).
      run: uv run --project tools/docs-sync docs-sync check --warn-only
