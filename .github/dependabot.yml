version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: daily
    labels:
      - dependencies
      - rust
    target-branch: main
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: daily
    labels:
      - dependencies
      - github-actions
    target-branch: main
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]