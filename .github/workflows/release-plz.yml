name: Release-plz

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    types: [closed]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run release in dry-run mode (no publish)"
        required: false
        default: false
        type: boolean

env:
  RELEASE_PLZ_GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}

jobs:
  release-plz-pr:
    name: Release-plz PR
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-pr-${{ github.ref }}
      cancel-in-progress: false
    env:
      RELEASE_PLZ_APP_ID: ${{ secrets.RELEASE_PLZ_APP_ID }}
      RELEASE_PLZ_APP_PRIVATE_KEY: ${{ secrets.RELEASE_PLZ_APP_PRIVATE_KEY }}
    steps:
      - name: Generate GitHub App token
        if: ${{ env.RELEASE_PLZ_APP_ID != '' && env.RELEASE_PLZ_APP_PRIVATE_KEY != '' }}
        id: app-token
        uses: actions/create-github-app-token@29824e69f54612133e76f7eaac726eef6c875baf # v2.2.1
        with:
          app-id: ${{ env.RELEASE_PLZ_APP_ID }}
          private-key: ${{ env.RELEASE_PLZ_APP_PRIVATE_KEY }}
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token || env.RELEASE_PLZ_GITHUB_TOKEN }}
          persist-credentials: true
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
      - name: Configure git auth for release-plz clones
        shell: bash
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token || env.RELEASE_PLZ_GITHUB_TOKEN }}
        run: |
          git config --global url."https://x-access-token:${GITHUB_TOKEN}@github.com/".insteadOf "https://github.com/"
      - name: Run release-plz release-pr
        id: release-plz
        uses: release-plz/action@11d4f18b632747e19114290c8bdfcba149ae9b85 # v0.5.127
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token || env.RELEASE_PLZ_GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
      - name: Sync docs version references in release PR
        if: ${{ steps.release-plz.outputs.prs_created == 'true' }}
        shell: bash
        env:
          PR_JSON: ${{ steps.release-plz.outputs.pr }}
        run: |
          set -euo pipefail

          pr_branch=$(echo "$PR_JSON" | python -c 'import json,sys; print(json.load(sys.stdin).get("head_branch",""))')
          if [ -z "$pr_branch" ] || [ "$pr_branch" = "null" ]; then
            echo "No release PR head branch returned. Skipping docs sync."
            exit 0
          fi

          git fetch origin "$pr_branch:$pr_branch"
          git checkout "$pr_branch"

          bash ./scripts/update-version.sh

          if git diff --quiet -- README.md docs; then
            echo "Docs version references already in sync."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs
          git commit -m "docs: sync version references for release PR"
          git push origin "HEAD:$pr_branch"

  release-plz-release:
    name: Release-plz release
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'release-plz/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-plz-release-${{ github.ref }}
      cancel-in-progress: false
    env:
      RELEASE_PLZ_APP_ID: ${{ secrets.RELEASE_PLZ_APP_ID }}
      RELEASE_PLZ_APP_PRIVATE_KEY: ${{ secrets.RELEASE_PLZ_APP_PRIVATE_KEY }}
    steps:
      - name: Generate GitHub App token
        if: ${{ env.RELEASE_PLZ_APP_ID != '' && env.RELEASE_PLZ_APP_PRIVATE_KEY != '' }}
        id: app-token
        uses: actions/create-github-app-token@29824e69f54612133e76f7eaac726eef6c875baf # v2.2.1
        with:
          app-id: ${{ env.RELEASE_PLZ_APP_ID }}
          private-key: ${{ env.RELEASE_PLZ_APP_PRIVATE_KEY }}
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token || env.RELEASE_PLZ_GITHUB_TOKEN }}
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
      - name: Configure git auth for release-plz clones
        shell: bash
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token || env.RELEASE_PLZ_GITHUB_TOKEN }}
        run: |
          git config --global url."https://x-access-token:${GITHUB_TOKEN}@github.com/".insteadOf "https://github.com/"
      - name: Run release-plz release
        uses: release-plz/action@11d4f18b632747e19114290c8bdfcba149ae9b85 # v0.5.127
        with:
          command: release
          dry_run: false
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token || env.RELEASE_PLZ_GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}

  release-plz-release-manual:
    name: Release-plz release (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-plz-release-manual-${{ github.ref }}
      cancel-in-progress: false
    env:
      RELEASE_PLZ_APP_ID: ${{ secrets.RELEASE_PLZ_APP_ID }}
      RELEASE_PLZ_APP_PRIVATE_KEY: ${{ secrets.RELEASE_PLZ_APP_PRIVATE_KEY }}
    steps:
      - name: Generate GitHub App token
        if: ${{ env.RELEASE_PLZ_APP_ID != '' && env.RELEASE_PLZ_APP_PRIVATE_KEY != '' }}
        id: app-token
        uses: actions/create-github-app-token@29824e69f54612133e76f7eaac726eef6c875baf # v2.2.1
        with:
          app-id: ${{ env.RELEASE_PLZ_APP_ID }}
          private-key: ${{ env.RELEASE_PLZ_APP_PRIVATE_KEY }}
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token || env.RELEASE_PLZ_GITHUB_TOKEN }}
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
      - name: Configure git auth for release-plz clones
        shell: bash
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token || env.RELEASE_PLZ_GITHUB_TOKEN }}
        run: |
          git config --global url."https://x-access-token:${GITHUB_TOKEN}@github.com/".insteadOf "https://github.com/"
      - name: Run release-plz release
        uses: release-plz/action@11d4f18b632747e19114290c8bdfcba149ae9b85 # v0.5.127
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token || env.RELEASE_PLZ_GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
