name: Release-plz

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    types: [closed]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run release in dry-run mode (no publish)"
        required: false
        default: false
        type: boolean

env:
  RELEASE_PLZ_GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}

jobs:
  release-plz-pr:
    name: Release-plz PR
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-pr-${{ github.ref }}
      cancel-in-progress: false
    env:
      RELEASE_PLZ_APP_ID: ${{ secrets.RELEASE_PLZ_APP_ID }}
      RELEASE_PLZ_APP_PRIVATE_KEY: ${{ secrets.RELEASE_PLZ_APP_PRIVATE_KEY }}
    steps:
      - name: Generate GitHub App token
        if: ${{ env.RELEASE_PLZ_APP_ID != '' && env.RELEASE_PLZ_APP_PRIVATE_KEY != '' }}
        id: app-token
        uses: actions/create-github-app-token@29824e69f54612133e76f7eaac726eef6c875baf # v2.2.1
        with:
          app-id: ${{ env.RELEASE_PLZ_APP_ID }}
          private-key: ${{ env.RELEASE_PLZ_APP_PRIVATE_KEY }}
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token || env.RELEASE_PLZ_GITHUB_TOKEN }}
          persist-credentials: true
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
      - name: Configure git auth for release-plz clones
        shell: bash
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token || env.RELEASE_PLZ_GITHUB_TOKEN }}
        run: |
          git config --global url."https://x-access-token:${GITHUB_TOKEN}@github.com/".insteadOf "https://github.com/"
      - name: Preflight release-pr guard
        id: preflight
        shell: bash
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token || env.RELEASE_PLZ_GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail

          api() {
            curl -fsSL \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com$1"
          }

          open_release_prs=$(api "/repos/${REPO}/pulls?state=open&head=${OWNER}:release-plz/&base=main&per_page=100" | jq 'length')
          if [ "${open_release_prs}" -gt 0 ]; then
            echo "run_release_pr=false" >> "$GITHUB_OUTPUT"
            echo "skip_reason=open release-plz PR already exists" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          associated_release_prs=$(
            api "/repos/${REPO}/commits/${SHA}/pulls?per_page=100" \
              | jq '[.[] | select(.merged_at != null and (.head.ref | startswith("release-plz/")))] | length'
          )
          if [ "${associated_release_prs}" -gt 0 ]; then
            echo "run_release_pr=false" >> "$GITHUB_OUTPUT"
            echo "skip_reason=current push is a merged release-plz PR commit" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "run_release_pr=true" >> "$GITHUB_OUTPUT"
          echo "skip_reason=none" >> "$GITHUB_OUTPUT"
      - name: Log preflight decision
        shell: bash
        run: |
          echo "release-pr guard decision: run=${{ steps.preflight.outputs.run_release_pr }}, reason='${{ steps.preflight.outputs.skip_reason }}'"
      - name: Run release-plz release-pr
        if: ${{ steps.preflight.outputs.run_release_pr == 'true' }}
        id: release-plz
        uses: release-plz/action@f708778669256143d984cce4b23592637532e040 # v0.5.127
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token || env.RELEASE_PLZ_GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
      - name: Build release PR title from released packages
        if: ${{ steps.release-plz.outputs.prs_created == 'true' }}
        id: pr-title
        shell: bash
        env:
          PR_JSON: ${{ steps.release-plz.outputs.pr }}
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          import os

          raw = os.environ.get("PR_JSON", "").strip()
          if not raw or raw == "null":
              raise SystemExit(0)

          payload = json.loads(raw)
          if isinstance(payload, list):
              payload = payload[0] if payload else {}

          if not isinstance(payload, dict):
              raise SystemExit("unexpected release-plz PR output format")

          releases = payload.get("releases") or []
          items = []
          for release in releases:
              if not isinstance(release, dict):
                  continue
              package = release.get("package_name") or release.get("package")
              version = release.get("version") or release.get("next_version")
              if package:
                  items.append((str(package), str(version) if version else ""))

          if not items:
              title = "chore(release): workspace release"
          elif len(items) == 1:
              package, version = items[0]
              title = f"chore({package}): release v{version}" if version else f"chore({package}): release"
          else:
              rendered = [f"{package} v{version}" if version else package for package, version in items]
              short = ", ".join(rendered[:3])
              if len(rendered) > 3:
                  short = f"{short} (+{len(rendered) - 3} more)"
              title = f"chore(release): {short}"

          if len(title) > 250:
              title = f"{title[:247]}..."

          output_path = os.environ["GITHUB_OUTPUT"]
          with open(output_path, "a", encoding="utf-8") as out:
              if payload.get("number") is not None:
                  out.write(f"pr_number={payload['number']}\n")
              out.write("pr_title<<EOF\n")
              out.write(f"{title}\n")
              out.write("EOF\n")
          PY
      - name: Update release PR title
        if: ${{ steps.release-plz.outputs.prs_created == 'true' && steps.pr-title.outputs.pr_number != '' }}
        shell: bash
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token || env.RELEASE_PLZ_GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr-title.outputs.pr_number }}
          PR_TITLE: ${{ steps.pr-title.outputs.pr_title }}
        run: |
          set -euo pipefail

          curl -fsSL \
            -X PATCH \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/pulls/${PR_NUMBER}" \
            -d "$(jq -cn --arg title "${PR_TITLE}" '{title: $title}')"
      - name: Sync docs version references in release PR
        if: ${{ steps.release-plz.outputs.prs_created == 'true' }}
        shell: bash
        env:
          PR_JSON: ${{ steps.release-plz.outputs.pr }}
        run: |
          set -euo pipefail

          pr_branch=$(echo "$PR_JSON" | python -c 'import json,sys; p=json.load(sys.stdin); p=p[0] if isinstance(p,list) and p else p; print((p or {}).get("head_branch",""))')
          if [ -z "$pr_branch" ] || [ "$pr_branch" = "null" ]; then
            echo "No release PR head branch returned. Skipping docs sync."
            exit 0
          fi

          git fetch origin "$pr_branch:$pr_branch"
          git checkout "$pr_branch"

          bash ./scripts/update-version.sh

          if git diff --quiet -- README.md docs; then
            echo "Docs version references already in sync."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs
          git commit -m "docs: sync version references for release PR"
          git push origin "HEAD:$pr_branch"

  release-plz-release:
    name: Release-plz release
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'release-plz/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-plz-release-${{ github.ref }}
      cancel-in-progress: false
    env:
      RELEASE_PLZ_APP_ID: ${{ secrets.RELEASE_PLZ_APP_ID }}
      RELEASE_PLZ_APP_PRIVATE_KEY: ${{ secrets.RELEASE_PLZ_APP_PRIVATE_KEY }}
    steps:
      - name: Generate GitHub App token
        if: ${{ env.RELEASE_PLZ_APP_ID != '' && env.RELEASE_PLZ_APP_PRIVATE_KEY != '' }}
        id: app-token
        uses: actions/create-github-app-token@29824e69f54612133e76f7eaac726eef6c875baf # v2.2.1
        with:
          app-id: ${{ env.RELEASE_PLZ_APP_ID }}
          private-key: ${{ env.RELEASE_PLZ_APP_PRIVATE_KEY }}
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token || env.RELEASE_PLZ_GITHUB_TOKEN }}
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
      - name: Configure git auth for release-plz clones
        shell: bash
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token || env.RELEASE_PLZ_GITHUB_TOKEN }}
        run: |
          git config --global url."https://x-access-token:${GITHUB_TOKEN}@github.com/".insteadOf "https://github.com/"
      - name: Run release-plz release
        uses: release-plz/action@f708778669256143d984cce4b23592637532e040 # v0.5.127
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token || env.RELEASE_PLZ_GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}

  release-plz-release-manual:
    name: Release-plz release (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-plz-release-manual-${{ github.ref }}
      cancel-in-progress: false
    env:
      RELEASE_PLZ_APP_ID: ${{ secrets.RELEASE_PLZ_APP_ID }}
      RELEASE_PLZ_APP_PRIVATE_KEY: ${{ secrets.RELEASE_PLZ_APP_PRIVATE_KEY }}
    steps:
      - name: Generate GitHub App token
        if: ${{ env.RELEASE_PLZ_APP_ID != '' && env.RELEASE_PLZ_APP_PRIVATE_KEY != '' }}
        id: app-token
        uses: actions/create-github-app-token@29824e69f54612133e76f7eaac726eef6c875baf # v2.2.1
        with:
          app-id: ${{ env.RELEASE_PLZ_APP_ID }}
          private-key: ${{ env.RELEASE_PLZ_APP_PRIVATE_KEY }}
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token || env.RELEASE_PLZ_GITHUB_TOKEN }}
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
      - name: Configure git auth for release-plz clones
        shell: bash
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token || env.RELEASE_PLZ_GITHUB_TOKEN }}
        run: |
          git config --global url."https://x-access-token:${GITHUB_TOKEN}@github.com/".insteadOf "https://github.com/"
      - name: Run release-plz release (dry-run)
        if: ${{ inputs.dry_run == true }}
        uses: release-plz/action@f708778669256143d984cce4b23592637532e040 # v0.5.127
        with:
          command: release
          dry_run: true
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token || env.RELEASE_PLZ_GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
      - name: Run release-plz release
        if: ${{ inputs.dry_run != true }}
        uses: release-plz/action@f708778669256143d984cce4b23592637532e040 # v0.5.127
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token || env.RELEASE_PLZ_GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
