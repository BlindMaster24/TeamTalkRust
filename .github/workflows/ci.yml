name: CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: never
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: sccache

jobs:
  validate:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        features: ["", "async", "dispatch", "offline", "all"]
        exclude:
          - os: windows-latest
            features: "offline"
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          cache-targets: false
      - name: sccache
        uses: mozilla-actions/sccache-action@v0.0.9
      - name: sync-version-refs
        if: matrix.os == 'ubuntu-latest'
        run: bash ./scripts/update-version.sh
      - name: sync-version-refs
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: ./scripts/update-version.ps1
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        shell: bash
        run: |
          if [ "${{ matrix.features }}" = "all" ]; then
            cargo clippy --workspace --all-targets --all-features -- -D warnings
          elif [ -n "${{ matrix.features }}" ]; then
            cargo clippy --workspace --all-targets --features "${{ matrix.features }}" -- -D warnings
          else
            cargo clippy --workspace --all-targets -- -D warnings
          fi
      - name: check
        shell: bash
        run: |
          if [ "${{ matrix.features }}" = "all" ]; then
            cargo check --workspace --all-targets --all-features
          elif [ -n "${{ matrix.features }}" ]; then
            cargo check --workspace --all-targets --features "${{ matrix.features }}"
          else
            cargo check --workspace --all-targets
          fi
      - name: test
        shell: bash
        run: |
          if [ "${{ matrix.features }}" = "all" ]; then
            cargo test --workspace --all-targets --all-features
          elif [ -n "${{ matrix.features }}" ]; then
            cargo test --workspace --all-targets --features "${{ matrix.features }}"
          else
            cargo test --workspace --all-targets
          fi
      - name: doc
        run: cargo doc --no-deps --all-features
      - name: docs-link-style
        if: matrix.os == 'ubuntu-latest'
        run: bash ./scripts/check-doc-links.sh
      - name: docs-link-style
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: ./scripts/check-doc-links.ps1
      - name: link-check
        if: matrix.os == 'ubuntu-latest'
        uses: lycheeverse/lychee-action@v1
        with:
          args: >-
            --verbose
            --no-progress
            --max-redirects 5
            --retry-wait-time 2
            --retry-count 2
            --exclude-mail
            README.md docs/**/*.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    name: Publish to crates.io
    needs: validate
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          cache-targets: false
      - name: sccache
        uses: mozilla-actions/sccache-action@v0.0.9
      - name: Publish teamtalk
        run: |
          cd crates/teamtalk
          cargo publish --token ${{ secrets.CRATES_IO_TOKEN }}
