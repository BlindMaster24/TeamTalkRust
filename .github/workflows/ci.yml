name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: never
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: sccache

jobs:
  validate:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        features: ["", "async", "dispatch", "offline", "all"]
        exclude:
          - os: windows-latest
            features: "offline"
          - os: ubuntu-latest
            features: "offline"
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          cache-targets: false
      - name: sccache
        uses: mozilla-actions/sccache-action@v0.0.9
      - name: verify-version-refs
        if: matrix.os == 'ubuntu-latest'
        run: bash ./scripts/check-version-refs.sh
      - name: verify-version-refs
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: ./scripts/check-version-refs.ps1
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        shell: bash
        run: |
          if [ "${{ matrix.features }}" = "all" ]; then
            cargo clippy --workspace --all-targets --all-features -- -D warnings
          elif [ -n "${{ matrix.features }}" ]; then
            cargo clippy --workspace --all-targets --features "${{ matrix.features }}" -- -D warnings
          else
            cargo clippy --workspace --all-targets -- -D warnings
          fi
      - name: check
        shell: bash
        run: |
          if [ "${{ matrix.features }}" = "all" ]; then
            cargo check --workspace --all-targets --all-features
          elif [ -n "${{ matrix.features }}" ]; then
            cargo check --workspace --all-targets --features "${{ matrix.features }}"
          else
            cargo check --workspace --all-targets
          fi
      - name: test
        shell: bash
        run: |
          if [ "${{ matrix.features }}" = "all" ]; then
            cargo test --workspace --all-targets --all-features
          elif [ -n "${{ matrix.features }}" ]; then
            cargo test --workspace --all-targets --features "${{ matrix.features }}"
          else
            cargo test --workspace --all-targets
          fi
      - name: doc
        run: cargo doc --no-deps --all-features
      - name: docs-link-style
        if: matrix.os == 'ubuntu-latest'
        run: bash ./scripts/check-doc-links.sh
      - name: docs-link-style
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: ./scripts/check-doc-links.ps1
      - name: link-check
        if: matrix.os == 'ubuntu-latest'
        uses: lycheeverse/lychee-action@8646ba30535128ac92d33dfc9133794bfdd9b411 # v2.8.0
        with:
          args: >-
            --verbose
            --no-progress
            --max-redirects 5
            --retry-wait-time 2
            README.md docs/**/*.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
